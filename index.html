<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Инфоген: генератор заданий и вариантов ОГЭ по информатике</title>
    <meta name="description" content="Генератор вариантов ОГЭ по информатике: бесконечные задания разной сложности, разборы решений и автопроверка ответов. Для девятиклассников и учителей." />
    <meta name="theme-color" content="#2563eb" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph & Social Meta Tags (после подключения своего домена заменить относительные пути на абсолютные URL) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Инфоген" />
    <meta property="og:title" content="Инфоген: генератор заданий и вариантов ОГЭ по информатике" />
    <meta property="og:description" content="Генератор вариантов ОГЭ по информатике: бесконечные задания разной сложности, разборы решений и автопроверка ответов. Для девятиклассников и учителей." />
    <!-- Краулеры соцсетей не понимают относительный путь, после выбора адреса/домена заменить на абсолютный URL -->
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || 'system';
          const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
